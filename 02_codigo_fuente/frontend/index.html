<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema de gestión y cotización de estructuras fotovoltaicas — HEXtructure S.A.S."
    />
    <title>SolarQuote</title>
    <script>
      // Antes de que React monte: evita el parpadeo oscuro→claro al
      // recargar si el usuario ya había elegido el modo claro.
      // Ver context/TemaProvider.tsx.
      try {
        if (localStorage.getItem("solarquote_tema") === "claro") {
          document.documentElement.setAttribute("data-tema", "claro");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
