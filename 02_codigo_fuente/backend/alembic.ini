# Configuración de Alembic (migraciones de base de datos)
#
# La URL de conexión NO se pone aquí — se lee desde el .env
# en alembic/env.py, para no exponer credenciales en el repo.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Formato del nombre de los archivos de migración:
# 2026_08_03_1430-a1b2c3d4e5f6_crear_tabla_usuarios.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

# ─── Logging ────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
